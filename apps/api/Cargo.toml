[package]
name = "brunn-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[features]
default = []
# Builds used only by the disposable gate-12e stack may point the read-only
# Todoist client at a loopback fixture server. Production builds never enable
# this feature, and runtime validation also rejects it under BRUNN_ENV=production.
todoist-fixture = []

[lib]
name = "brunn"
path = "src/lib.rs"

[[bin]]
name = "brunn"
path = "src/main.rs"

[[bin]]
name = "brunn-state"
path = "src/bin/brunn-state.rs"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
filetime = "0.2"
fs2 = "0.4"
futures = "0.3"
globset = "0.4"
hex = "0.4"
hmac = "0.12"
http = "1"
infer = "0.19"
mime_guess = "2"
json-patch = "4"
jsonwebtoken = "9"
libc = "0.2"
mime = "0.3"
metrics = "0.24.5"
metrics-exporter-dogstatsd = "0.9.8"
once_cell = "1"
percent-encoding = "2"
pgvector = { version = "0.4", features = ["sqlx"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "multipart", "rustls-tls", "stream"] }
rrule = "0.14"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate"] }
subtle = "2"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate", "time"] }
zxcvbn = "3.1.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
