name: Straylight

options:
  minimumXcodeGenVersion: 2.45.4
  bundleIdPrefix: com.rourkem
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.2.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Straylight:
    type: application
    platform: iOS
    sources:
      - path: Straylight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.straylight
        PRODUCT_NAME: Straylight
        INFOPLIST_FILE: Straylight/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Straylight/Resources/Straylight.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  StraylightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StraylightTests
    dependencies:
      - target: Straylight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.straylight.tests
        GENERATE_INFOPLIST_FILE: YES

  StraylightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StraylightUITests
    dependencies:
      - target: Straylight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.straylight.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Straylight:
    build:
      targets:
        Straylight: all
        StraylightTests: [test]
        StraylightUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: StraylightTests
        - name: StraylightUITests
