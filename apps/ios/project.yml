name: Brunn

options:
  minimumXcodeGenVersion: 2.45.4
  bundleIdPrefix: com.rourkem
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 0.2.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Brunn:
    type: application
    platform: iOS
    sources:
      - path: Brunn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.brunn
        PRODUCT_NAME: Brunn
        DEVELOPMENT_TEAM: 8WW8JUE95L
        INFOPLIST_FILE: Brunn/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Brunn/Resources/Brunn.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          BRUNN_APNS_ENVIRONMENT: development
        Release:
          BRUNN_APNS_ENVIRONMENT: production

  BrunnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrunnTests
    dependencies:
      - target: Brunn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.brunn.tests
        GENERATE_INFOPLIST_FILE: YES

  BrunnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrunnUITests
    dependencies:
      - target: Brunn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.brunn.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Brunn:
    build:
      targets:
        Brunn: all
        BrunnTests: [test]
        BrunnUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: BrunnTests
        - name: BrunnUITests
