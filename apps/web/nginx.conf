resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=straylight_ready:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=straylight_api_limit:10m rate=20r/s;

upstream straylight_api {
    zone straylight_api 64k;
    server api:8080 resolve;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Administrative provisioning and evaluation import remain host-local.
    # The production topology exposes only this proxy, never the API port.
    location ^~ /api/v1/admin/ {
        return 404;
    }

    location = /api/ready {
        limit_req zone=straylight_ready burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://straylight_api/ready;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=straylight_api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://straylight_api/;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
