resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=brunn_ready:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=brunn_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=brunn_auth_limit:1m rate=2r/s;

upstream brunn_api {
    zone brunn_api 64k;
    server api:8080 resolve;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Administrative provisioning and evaluation import remain host-local.
    # The production topology exposes only this proxy, never the API port.
    location ^~ /api/v1/admin/ {
        return 404;
    }

    location = /api/ready {
        limit_req zone=brunn_ready burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://brunn_api/ready;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # The workspace API accepts exact streamed binaries up to 4 GiB. Keep
    # this route out of nginx's bounded multipart path and stream it directly
    # so large durable artifacts are not buffered to the web container disk.
    location = /api/v1/workspace/binaries/content {
        client_max_body_size 4g;
        limit_req zone=brunn_api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://brunn_api/v1/workspace/binaries/content;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v1/auth/ {
        client_max_body_size 16k;
        limit_req zone=brunn_auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://brunn_api/v1/auth/;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location /api/ {
        # Rust applies route-specific 9 MiB and 72 MiB limits to upload parts
        # and bounded staging. Keep the proxy ceiling just above the larger
        # contract so valid agent uploads reach those checks.
        client_max_body_size 73m;
        limit_req zone=brunn_api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://brunn_api/;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
