x-managed-s3-environment: &managed-s3-environment
  BRUNN_S3_ENDPOINT: ${BRUNN_S3_ENDPOINT:-}
  BRUNN_S3_REGION: ${BRUNN_S3_REGION:?set BRUNN_S3_REGION}
  BRUNN_S3_BUCKET: ${BRUNN_S3_BUCKET:?set BRUNN_S3_BUCKET}
  BRUNN_S3_FORCE_PATH_STYLE: ${BRUNN_S3_FORCE_PATH_STYLE:-false}
  BRUNN_S3_CREATE_BUCKET: "false"
  BRUNN_S3_ACCESS_KEY: ""
  BRUNN_S3_SECRET_KEY: ""
  BRUNN_S3_ACCESS_KEY_FILE: ${BRUNN_S3_ACCESS_KEY_FILE:-}
  BRUNN_S3_SECRET_KEY_FILE: ${BRUNN_S3_SECRET_KEY_FILE:-}
  BRUNN_MINIO_ENDPOINT: ""
  BRUNN_MINIO_REGION: ""
  BRUNN_MINIO_BUCKET: ""
  BRUNN_MINIO_ACCESS_KEY: ""
  BRUNN_MINIO_SECRET_KEY: ""
  BRUNN_MINIO_ACCESS_KEY_FILE: ""
  BRUNN_MINIO_SECRET_KEY_FILE: ""
  # Long-lived keys are never expanded into rendered Compose configuration.
  # Platforms may mount the two files above or attach a workload identity.
  AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
  AWS_ROLE_SESSION_NAME: ${AWS_ROLE_SESSION_NAME:-}
  AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
  AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:-}
  AWS_CONTAINER_CREDENTIALS_FULL_URI: ${AWS_CONTAINER_CREDENTIALS_FULL_URI:-}
  AWS_REGION: ${BRUNN_S3_REGION:?set BRUNN_S3_REGION}
  AWS_DEFAULT_REGION: ${BRUNN_S3_REGION:?set BRUNN_S3_REGION}

services:
  # These definitions remain available in compose.yaml for development and
  # self-hosted recovery. The hosted overlay never activates this profile.
  minio-permissions:
    profiles: ["local-object-store"]

  minio:
    profiles: ["local-object-store"]

  minio-init:
    profiles: ["local-object-store"]

  migrate:
    environment:
      <<: *managed-s3-environment
    secrets: !override
      - database_url_rw
      - database_url_ro
      - database_url_admin
      - continuation_signing_key
      - openai_api_key

  api:
    environment:
      <<: *managed-s3-environment
    secrets: !override
      - database_url_rw
      - database_url_ro
      - continuation_signing_key
      - openai_api_key
      - resend_api_key
      - notification_token_encryption_key
      - secret_encryption_key
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  worker:
    environment:
      <<: *managed-s3-environment
    secrets: !override
      - database_url_rw
      - database_url_ro
      - database_url_admin
      - continuation_signing_key
      - openai_api_key
      - notification_token_encryption_key
      - secret_encryption_key
      - apns_private_key
    depends_on: !override
      migrate:
        condition: service_completed_successfully
