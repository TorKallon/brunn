services:
  db:
    build: !reset null
    image: ${BRUNN_DATABASE_IMAGE:?set BRUNN_DATABASE_IMAGE}
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      APP_RW_PASSWORD: ""
      APP_RW_PASSWORD_FILE: /run/secrets/postgres_app_rw_password
      APP_RO_PASSWORD: ""
      APP_RO_PASSWORD_FILE: /run/secrets/postgres_app_ro_password
    secrets:
      - postgres_admin_password
      - postgres_app_rw_password
      - postgres_app_ro_password

  minio:
    build: !reset null
    image: ${BRUNN_OBJECT_STORE_IMAGE:-brunn-object-store:release-blocked}
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ""
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password

  minio-init:
    build: !reset null
    image: ${BRUNN_OBJECT_STORE_CLIENT_IMAGE:-brunn-object-store-client:release-blocked}
    environment:
      MINIO_ROOT_USER: ""
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      BRUNN_MINIO_ACCESS_KEY: ""
      BRUNN_MINIO_ACCESS_KEY_FILE: /run/secrets/minio_app_access_key
      BRUNN_MINIO_SECRET_KEY: ""
      BRUNN_MINIO_SECRET_KEY_FILE: /run/secrets/minio_app_secret_key
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_app_access_key
      - minio_app_secret_key

  migrate:
    build: !reset null
    image: ${BRUNN_API_IMAGE:-brunn-api:release-blocked}
    environment: &production-app-environment
      BRUNN_ENV: production
      BRUNN_LEGACY_API_ENABLED: ${BRUNN_LEGACY_API_ENABLED:-false}
      BRUNN_EVALUATION_API_ENABLED: "false"
      BRUNN_MESSAGING_ENABLED: ${BRUNN_MESSAGING_ENABLED:-false}
      DD_ENV: production
      DD_VERSION: ${BRUNN_RELEASE_REVISION:-unreleased}
      DATABASE_URL_RW: ""
      BRUNN_DATABASE_URL: ""
      DATABASE_URL_RW_FILE: /run/secrets/database_url_rw
      DATABASE_URL_RO: ""
      BRUNN_READ_ONLY_DATABASE_URL: ""
      DATABASE_URL_RO_FILE: /run/secrets/database_url_ro
      DATABASE_URL_ADMIN: ""
      BRUNN_ADMIN_DATABASE_URL: ""
      DATABASE_URL_ADMIN_FILE: /run/secrets/database_url_admin
      BRUNN_S3_ACCESS_KEY: ""
      BRUNN_MINIO_ACCESS_KEY: ""
      BRUNN_S3_ACCESS_KEY_FILE: /run/secrets/minio_app_access_key
      BRUNN_S3_SECRET_KEY: ""
      BRUNN_MINIO_SECRET_KEY: ""
      BRUNN_S3_SECRET_KEY_FILE: /run/secrets/minio_app_secret_key
      BRUNN_CONTINUATION_SECRET: ""
      BRUNN_CONTINUATION_SIGNING_KEY: ""
      BRUNN_CONTINUATION_SECRET_FILE: /run/secrets/continuation_signing_key
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      BRUNN_DEV_READ_WRITE_TOKEN: ""
      BRUNN_DEV_READ_ONLY_TOKEN: ""
    secrets: &production-app-secrets
      - database_url_rw
      - database_url_ro
      - database_url_admin
      - minio_app_access_key
      - minio_app_secret_key
      - continuation_signing_key
      - openai_api_key

  api:
    build: !reset null
    image: ${BRUNN_API_IMAGE:-brunn-api:release-blocked}
    ports: !reset []
    environment:
      <<: *production-app-environment
      DATABASE_URL_ADMIN_FILE: ""
      RESEND_API_KEY: ""
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?set AUTH_EMAIL_FROM}
      AUTH_EMAIL_REPLY_TO: ${AUTH_EMAIL_REPLY_TO:-}
      BRUNN_PUBLIC_URL: ${BRUNN_PUBLIC_URL:?set BRUNN_PUBLIC_URL}
      BRUNN_APNS_APP_ID: ${BRUNN_APNS_APP_ID:?set BRUNN_APNS_APP_ID}
      BRUNN_APNS_DELIVERY_ENABLED: ${BRUNN_APNS_DELIVERY_ENABLED:-false}
      BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY: ""
      BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/notification_token_encryption_key
      BRUNN_SECRET_ENCRYPTION_KEY: ""
      BRUNN_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/secret_encryption_key
      BRUNN_TODOIST_SYNC_ENABLED: ${BRUNN_TODOIST_SYNC_ENABLED:-false}
    labels:
      com.datadoghq.tags.env: production
      com.datadoghq.tags.service: ${DD_SERVICE:-brunn}
      com.datadoghq.tags.version: ${BRUNN_RELEASE_REVISION:-unreleased}
      com.brunn.component: api
      com.datadoghq.ad.logs: >-
        [{"source":"rust","service":"brunn"}]
    secrets:
      - database_url_rw
      - database_url_ro
      - minio_app_access_key
      - minio_app_secret_key
      - continuation_signing_key
      - openai_api_key
      - resend_api_key
      - notification_token_encryption_key
      - secret_encryption_key

  worker:
    build: !reset null
    image: ${BRUNN_API_IMAGE:-brunn-api:release-blocked}
    environment:
      <<: *production-app-environment
      BRUNN_APNS_APP_ID: ${BRUNN_APNS_APP_ID:?set BRUNN_APNS_APP_ID}
      BRUNN_APNS_DELIVERY_ENABLED: ${BRUNN_APNS_DELIVERY_ENABLED:-false}
      BRUNN_APNS_TEAM_ID: ${BRUNN_APNS_TEAM_ID:?set BRUNN_APNS_TEAM_ID}
      BRUNN_APNS_KEY_ID: ${BRUNN_APNS_KEY_ID:?set BRUNN_APNS_KEY_ID}
      BRUNN_APNS_PRIVATE_KEY: ""
      BRUNN_APNS_PRIVATE_KEY_FILE: /run/secrets/apns_private_key
      BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY: ""
      BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/notification_token_encryption_key
      BRUNN_SECRET_ENCRYPTION_KEY: ""
      BRUNN_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/secret_encryption_key
      BRUNN_TODOIST_SYNC_ENABLED: ${BRUNN_TODOIST_SYNC_ENABLED:-false}
    secrets:
      - database_url_rw
      - database_url_ro
      - database_url_admin
      - minio_app_access_key
      - minio_app_secret_key
      - continuation_signing_key
      - openai_api_key
      - notification_token_encryption_key
      - secret_encryption_key
      - apns_private_key
    labels:
      com.datadoghq.tags.env: production
      com.datadoghq.tags.service: ${DD_SERVICE:-brunn}
      com.datadoghq.tags.version: ${BRUNN_RELEASE_REVISION:-unreleased}
      com.brunn.component: worker
      com.datadoghq.ad.logs: >-
        [{"source":"rust","service":"brunn"}]

  web:
    build: !reset null
    image: ${BRUNN_WEB_IMAGE:-brunn-web:release-blocked}
    ports: !reset []

  mcp:
    build: !reset null
    image: ${BRUNN_MCP_IMAGE:-brunn-mcp:release-blocked}
    environment:
      BRUNN_MESSAGING_ENABLED: ${BRUNN_MESSAGING_ENABLED:-false}

  datadog-agent:
    environment:
      DD_API_KEY: ENC[dd_api_key]
      DD_SECRET_BACKEND_TYPE: docker.secrets
      DD_ENV: production
      DD_LOGS_ENABLED: "false"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "false"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "false"
    secrets:
      - dd_api_key
    volumes: !reset []

  edge-permissions:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    command:
      - /bin/sh
      - -ec
      - |
        for directory in /data /config; do
          marker="$${directory}/.brunn-owner-10001"
          if [ ! -e "$${marker}" ]; then
            chown -R 10001:10001 "$${directory}"
            : > "$${marker}"
            chown 10001:10001 "$${marker}"
          fi
        done
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  edge:
    image: ${BRUNN_EDGE_IMAGE:-brunn-caddy:release-blocked}
    environment:
      BRUNN_PUBLIC_HOST: ${BRUNN_PUBLIC_HOST:?set BRUNN_PUBLIC_HOST}
      BRUNN_ACME_EMAIL: ${BRUNN_ACME_EMAIL:?set BRUNN_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      edge-permissions:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy_data:
  caddy_config:

secrets:
  postgres_admin_password:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/postgres_admin_password
  postgres_app_rw_password:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/postgres_app_rw_password
  postgres_app_ro_password:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/postgres_app_ro_password
  database_url_rw:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/database_url_rw
  database_url_ro:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/database_url_ro
  database_url_admin:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/database_url_admin
  minio_root_user:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/minio_root_user
  minio_root_password:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/minio_root_password
  minio_app_access_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/minio_app_access_key
  minio_app_secret_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/minio_app_secret_key
  continuation_signing_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/continuation_signing_key
  notification_token_encryption_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/notification_token_encryption_key
  secret_encryption_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/secret_encryption_key
  apns_private_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/apns_private_key
  openai_api_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/openai_api_key
  resend_api_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/resend_api_key
  dd_api_key:
    file: ${BRUNN_SECRETS_DIR:-./secrets}/dd_api_key
