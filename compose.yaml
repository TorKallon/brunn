name: brunn

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  args:
    BRUNN_BUILD_REVISION: ${DD_VERSION:-local}

x-common-labels: &common-labels
  com.datadoghq.tags.env: ${DD_ENV:-development}
  com.datadoghq.tags.service: ${DD_SERVICE:-brunn}
  com.datadoghq.tags.version: ${DD_VERSION:-local}

x-common-environment: &common-environment
  BRUNN_ENV: ${BRUNN_ENV:-development}
  BRUNN_LEGACY_API_ENABLED: ${BRUNN_LEGACY_API_ENABLED:-true}
  BRUNN_EVALUATION_API_ENABLED: ${BRUNN_EVALUATION_API_ENABLED:-true}
  BRUNN_MESSAGING_ENABLED: ${BRUNN_MESSAGING_ENABLED:-false}
  BRUNN_LOCATION_PINGS_ENABLED: ${BRUNN_LOCATION_PINGS_ENABLED:-true}
  BRUNN_LOCATION_PRESENCE_IN_OPEN: ${BRUNN_LOCATION_PRESENCE_IN_OPEN:-true}
  BRUNN_SUPERSESSION_DEMOTION: ${BRUNN_SUPERSESSION_DEMOTION:-false}
  BRUNN_SUPERSESSION_DEMOTION_WEIGHT: ${BRUNN_SUPERSESSION_DEMOTION_WEIGHT:-1.5}
  BRUNN_INTENTION_LEDGER: ${BRUNN_INTENTION_LEDGER:-false}
  BRUNN_READ_PATH_ROUNDTRIP_V1: ${BRUNN_READ_PATH_ROUNDTRIP_V1:-false}
  BRUNN_LEXICAL_SINGLE_SCAN: ${BRUNN_LEXICAL_SINGLE_SCAN:-false}
  BRUNN_RESUME_DELTAS: ${BRUNN_RESUME_DELTAS:-false}
  RUST_LOG: ${RUST_LOG:-info,brunn=debug}
  BRUNN_BIND: 0.0.0.0:8080
  BRUNN_BIND_ADDR: 0.0.0.0:8080
  BRUNN_S3_ENDPOINT: ${BRUNN_S3_ENDPOINT:-http://minio:9000}
  BRUNN_S3_REGION: ${BRUNN_S3_REGION:-us-east-1}
  BRUNN_S3_BUCKET: ${BRUNN_S3_BUCKET:-brunn}
  BRUNN_MINIO_ENDPOINT: http://minio:9000
  BRUNN_MINIO_REGION: ${BRUNN_MINIO_REGION:-us-east-1}
  BRUNN_MINIO_BUCKET: ${BRUNN_MINIO_BUCKET:-brunn}
  BRUNN_EMBEDDING_PROVIDER: ${BRUNN_EMBEDDING_PROVIDER:-openai}
  BRUNN_ALLOW_DEGRADED_EMBEDDINGS: ${BRUNN_ALLOW_DEGRADED_EMBEDDINGS:-false}
  BRUNN_EMBEDDING_MODEL: ${BRUNN_EMBEDDING_MODEL:-text-embedding-3-small}
  BRUNN_EMBEDDING_DIMENSIONS: ${BRUNN_EMBEDDING_DIMENSIONS:-1536}
  BRUNN_OBSERVABILITY_TIMINGS_MS: ${BRUNN_OBSERVABILITY_TIMINGS_MS:-true}
  BRUNN_VERBATIM_SPANS: ${BRUNN_VERBATIM_SPANS:-false}
  BRUNN_SEMANTIC_LANE: ${BRUNN_SEMANTIC_LANE:-false}
  BRUNN_EMBED_CACHE: ${BRUNN_EMBED_CACHE:-true}
  BRUNN_SEMANTIC_DEADLINE_MS: ${BRUNN_SEMANTIC_DEADLINE_MS:-2500}
  BRUNN_EMBEDDING_BACKFILL_GUARD: ${BRUNN_EMBEDDING_BACKFILL_GUARD:-true}
  BRUNN_EMBEDDING_BACKFILL_BATCH_CHUNKS: ${BRUNN_EMBEDDING_BACKFILL_BATCH_CHUNKS:-64}
  BRUNN_EMBEDDING_BACKFILL_INTER_BATCH_MS: ${BRUNN_EMBEDDING_BACKFILL_INTER_BATCH_MS:-250}
  BRUNN_EMBEDDING_BACKFILL_OPEN_P95_LIMIT_MS: ${BRUNN_EMBEDDING_BACKFILL_OPEN_P95_LIMIT_MS:-120}
  BRUNN_EMBEDDING_BACKFILL_SEARCH_P95_LIMIT_MS: ${BRUNN_EMBEDDING_BACKFILL_SEARCH_P95_LIMIT_MS:-107}
  BRUNN_EMBEDDING_BACKFILL_FOREGROUND_STATUS_URL: ${BRUNN_EMBEDDING_BACKFILL_FOREGROUND_STATUS_URL:-http://api:8080/health/foreground-latency}
  BRUNN_EMBEDDING_BACKFILL_FOREGROUND_STATUS_TIMEOUT_MS: ${BRUNN_EMBEDDING_BACKFILL_FOREGROUND_STATUS_TIMEOUT_MS:-1000}
  BRUNN_DREAM_MODEL: ${BRUNN_DREAM_MODEL:-gpt-5.6}
  BRUNN_CAPTURE_MODEL: ${BRUNN_CAPTURE_MODEL:-gpt-5.6}
  BRUNN_CAPTURE_MAX_OUTPUT_TOKENS: ${BRUNN_CAPTURE_MAX_OUTPUT_TOKENS:-8192}
  BRUNN_STATE_ASSET_DESCRIPTION_MODEL: ${BRUNN_STATE_ASSET_DESCRIPTION_MODEL:-gpt-5.6}
  BRUNN_STATE_ASSET_DESCRIPTION_MAX_OUTPUT_TOKENS: ${BRUNN_STATE_ASSET_DESCRIPTION_MAX_OUTPUT_TOKENS:-4096}
  BRUNN_STATE_ASSET_DESCRIPTION_IMAGE_DETAIL: ${BRUNN_STATE_ASSET_DESCRIPTION_IMAGE_DETAIL:-high}
  BRUNN_DREAM_SCHEDULER_ENABLED: ${BRUNN_DREAM_SCHEDULER_ENABLED:-false}
  BRUNN_DREAM_SCHEDULER_POLL_SECONDS: ${BRUNN_DREAM_SCHEDULER_POLL_SECONDS:-15}
  BRUNN_DREAM_INACTIVITY_SECONDS: ${BRUNN_DREAM_INACTIVITY_SECONDS:-60}
  BRUNN_DREAM_COOLDOWN_SECONDS: ${BRUNN_DREAM_COOLDOWN_SECONDS:-900}
  BRUNN_DREAM_DIRTY_THRESHOLD: ${BRUNN_DREAM_DIRTY_THRESHOLD:-10}
  BRUNN_BACKGROUND_JOB_LEASE_SECONDS: ${BRUNN_BACKGROUND_JOB_LEASE_SECONDS:-300}
  BRUNN_ACCOUNT_EXPORT_TTL_HOURS: ${BRUNN_ACCOUNT_EXPORT_TTL_HOURS:-24}
  BRUNN_ACCOUNT_EXPORT_TEMP_DIR: /tmp/brunn-exports
  BRUNN_ACCOUNT_DELETION_BACKUP_RETENTION_DAYS: ${BRUNN_ACCOUNT_DELETION_BACKUP_RETENTION_DAYS:-30}
  BRUNN_DATABASE_MAX_CONNECTIONS: ${BRUNN_DATABASE_MAX_CONNECTIONS:-20}
  BRUNN_MATERIALIZE_TOKEN_BUDGET: ${BRUNN_MATERIALIZE_TOKEN_BUDGET:-24000}
  BRUNN_SEARCH_FAIR_SHARE: ${BRUNN_SEARCH_FAIR_SHARE:-false}
  BRUNN_SEARCH_TOP1_HYDRATION: ${BRUNN_SEARCH_TOP1_HYDRATION:-false}
  BRUNN_SEARCH_CHAR_CAP: ${BRUNN_SEARCH_CHAR_CAP:-false}
  BRUNN_SEARCH_SECTION_DEMOTION_TOP_N: ${BRUNN_SEARCH_SECTION_DEMOTION_TOP_N:-}
  BRUNN_REQUEST_TIMEOUT_SECONDS: ${BRUNN_REQUEST_TIMEOUT_SECONDS:-30}
  BRUNN_TRANSFER_TIMEOUT_SECONDS: ${BRUNN_TRANSFER_TIMEOUT_SECONDS:-3600}
  BRUNN_MAX_CONCURRENT_TRANSFERS: ${BRUNN_MAX_CONCURRENT_TRANSFERS:-8}
  BRUNN_READINESS_TIMEOUT_SECONDS: ${BRUNN_READINESS_TIMEOUT_SECONDS:-3}
  BRUNN_ALLOWED_ORIGINS: ${BRUNN_ALLOWED_ORIGINS:-}
  BRUNN_DEV_USER_REF: ${BRUNN_DEV_USER_REF:-user:local}
  BRUNN_DEV_USER_NAME: ${BRUNN_DEV_USER_NAME:-Local user}
  OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  BRUNN_METRICS_ENABLED: ${BRUNN_METRICS_ENABLED:-false}
  BRUNN_DOGSTATSD_ADDR: ${BRUNN_DOGSTATSD_ADDR:-datadog-agent:8125}
  BRUNN_METRICS_FLUSH_SECONDS: ${BRUNN_METRICS_FLUSH_SECONDS:-3}
  DD_ENV: ${DD_ENV:-development}
  DD_SERVICE: ${DD_SERVICE:-brunn}
  DD_VERSION: ${DD_VERSION:-local}

services:
  db:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
      args:
        BRUNN_BUILD_REVISION: ${BRUNN_BUILD_REVISION:-local}
    image: ${BRUNN_DATABASE_IMAGE:-brunn-postgres:local}
    command:
      - postgres
      - -c
      - max_wal_size=${BRUNN_POSTGRES_MAX_WAL_SIZE:-4GB}
      - -c
      - min_wal_size=${BRUNN_POSTGRES_MIN_WAL_SIZE:-1GB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brunn}
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      APP_RW_PASSWORD: ${POSTGRES_APP_RW_PASSWORD:-}
      APP_RO_PASSWORD: ${POSTGRES_APP_RO_PASSWORD:-}
      POSTGRES_INITDB_ARGS: >-
        --locale-provider=builtin --builtin-locale=C.UTF-8
        --encoding=UTF8 --data-checksums
    ports:
      - "127.0.0.1:${BRUNN_POSTGRES_PORT:-15110}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/brunn-postgres-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 6g
    cpus: 4
    pids_limit: 512
    shm_size: 256m

  minio-permissions:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    command:
      - /bin/sh
      - -ec
      - |
        marker=/data/.brunn-owner-10001
        if [ ! -e "$${marker}" ]; then
          chown -R 10001:10001 /data
          : > "$${marker}"
          chown 10001:10001 "$${marker}"
        fi
    volumes:
      - minio_data:/data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  minio:
    build:
      context: infra/minio
      args:
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        BRUNN_BUILD_REVISION: ${DD_VERSION:-local}
    image: brunn-minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:${BRUNN_MINIO_PORT:-19110}:9000"
      - "127.0.0.1:${BRUNN_MINIO_CONSOLE_PORT:-19111}:9001"
    volumes:
      - minio_data:/data
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 3g
    cpus: 3
    pids_limit: 512

  minio-init:
    build:
      context: infra/minio-client
      args:
        MC_COMMIT: 7394ce0dd2a80935aded936b09fa12cbb3cb8096
        MC_RELEASE: RELEASE.2025-08-13T08-35-41Z
        BRUNN_BUILD_REVISION: ${DD_VERSION:-local}
    image: brunn-minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      BRUNN_MINIO_BUCKET: ${BRUNN_MINIO_BUCKET:-brunn}
      BRUNN_MINIO_ACCESS_KEY: ${BRUNN_MINIO_ACCESS_KEY:-}
      BRUNN_MINIO_SECRET_KEY: ${BRUNN_MINIO_SECRET_KEY:-}
    volumes:
      - ./infra/minio/app-policy.json:/config/app-policy.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        load_secret() {
          variable=$$1
          file_variable="$${variable}_FILE"
          eval "value=\$${$${variable}:-}"
          eval "file=\$${$${file_variable}:-}"
          if [ -n "$${value}" ] && [ -n "$${file}" ]; then
            echo "$${variable} and $${file_variable} cannot both be set" >&2
            exit 1
          fi
          if [ -n "$${file}" ]; then
            value=$$(cat "$${file}")
            export "$${variable}=$${value}"
          fi
          [ -n "$${value}" ] || {
            echo "$${variable} is required" >&2
            exit 1
          }
        }
        for variable in MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
          BRUNN_MINIO_ACCESS_KEY BRUNN_MINIO_SECRET_KEY; do
          load_secret "$${variable}"
        done
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${BRUNN_MINIO_BUCKET}"
        mc version enable "local/$${BRUNN_MINIO_BUCKET}"
        mc anonymous set none "local/$${BRUNN_MINIO_BUCKET}"
        : > /tmp/brunn-app-policy.json
        while IFS= read -r policy_line || [ -n "$${policy_line}" ]; do
          printf '%s\n' \
            "$${policy_line//__BRUNN_BUCKET__/$${BRUNN_MINIO_BUCKET}}" \
            >> /tmp/brunn-app-policy.json
        done < /config/app-policy.json
        mc admin user add local "$${BRUNN_MINIO_ACCESS_KEY}" "$${BRUNN_MINIO_SECRET_KEY}" || \
          mc admin user info local "$${BRUNN_MINIO_ACCESS_KEY}"
        mc admin policy create local brunn-app /tmp/brunn-app-policy.json || \
          mc admin policy info local brunn-app
        mc admin policy attach local brunn-app --user "$${BRUNN_MINIO_ACCESS_KEY}"
    restart: "no"

  migrate:
    build: *api-build
    image: brunn-api:local
    command: ["migrate"]
    environment:
      <<: *common-environment
      DATABASE_URL_RW: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      DATABASE_URL_RO: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_DATABASE_URL: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_READ_ONLY_DATABASE_URL: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      DATABASE_URL_ADMIN: postgres://admin:${POSTGRES_ADMIN_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_ADMIN_DATABASE_URL: postgres://admin:${POSTGRES_ADMIN_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_S3_ACCESS_KEY: ${BRUNN_S3_ACCESS_KEY:-}
      BRUNN_S3_SECRET_KEY: ${BRUNN_S3_SECRET_KEY:-}
      BRUNN_MINIO_ACCESS_KEY: ${BRUNN_MINIO_ACCESS_KEY:-}
      BRUNN_MINIO_SECRET_KEY: ${BRUNN_MINIO_SECRET_KEY:-}
      BRUNN_CONTINUATION_SECRET: ${BRUNN_CONTINUATION_SIGNING_KEY:-}
      BRUNN_CONTINUATION_SIGNING_KEY: ${BRUNN_CONTINUATION_SIGNING_KEY:-}
      BRUNN_DEV_READ_WRITE_TOKEN: ${BRUNN_DEV_READ_WRITE_TOKEN:-}
      BRUNN_DEV_READ_ONLY_TOKEN: ${BRUNN_DEV_READ_ONLY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: brunn-api:local
    command: ["serve"]
    environment:
      <<: *common-environment
      DATABASE_URL_RW: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      DATABASE_URL_RO: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_DATABASE_URL: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_READ_ONLY_DATABASE_URL: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_S3_ACCESS_KEY: ${BRUNN_S3_ACCESS_KEY:-}
      BRUNN_S3_SECRET_KEY: ${BRUNN_S3_SECRET_KEY:-}
      BRUNN_MINIO_ACCESS_KEY: ${BRUNN_MINIO_ACCESS_KEY:-}
      BRUNN_MINIO_SECRET_KEY: ${BRUNN_MINIO_SECRET_KEY:-}
      BRUNN_CONTINUATION_SECRET: ${BRUNN_CONTINUATION_SIGNING_KEY:-}
      BRUNN_CONTINUATION_SIGNING_KEY: ${BRUNN_CONTINUATION_SIGNING_KEY:-}
      BRUNN_DEV_READ_WRITE_TOKEN: ${BRUNN_DEV_READ_WRITE_TOKEN:-}
      BRUNN_DEV_READ_ONLY_TOKEN: ${BRUNN_DEV_READ_ONLY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_KEY_FILE: ${RESEND_API_KEY_FILE:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_EMAIL_REPLY_TO: ${AUTH_EMAIL_REPLY_TO:-}
      BRUNN_PUBLIC_URL: ${BRUNN_PUBLIC_URL:-http://localhost:13110}
      BRUNN_APNS_APP_ID: ${BRUNN_APNS_APP_ID:-}
      BRUNN_APNS_DELIVERY_ENABLED: ${BRUNN_APNS_DELIVERY_ENABLED:-false}
      BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY:-}
      BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY_FILE: ${BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY_FILE:-}
      BRUNN_SECRET_ENCRYPTION_KEY: ${BRUNN_SECRET_ENCRYPTION_KEY:-}
      BRUNN_SECRET_ENCRYPTION_KEY_FILE: ${BRUNN_SECRET_ENCRYPTION_KEY_FILE:-}
      BRUNN_TODOIST_SYNC_ENABLED: ${BRUNN_TODOIST_SYNC_ENABLED:-false}
    labels:
      <<: *common-labels
      com.brunn.component: api
      com.datadoghq.ad.logs: >-
        [{"source":"rust","service":"brunn"}]
    ports:
      - "127.0.0.1:${BRUNN_API_PORT:-18110}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/brunn", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build: *api-build
    image: brunn-api:local
    command: ["worker"]
    environment:
      <<: *common-environment
      DATABASE_URL_RW: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      DATABASE_URL_RO: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_DATABASE_URL: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_READ_ONLY_DATABASE_URL: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      DATABASE_URL_ADMIN: postgres://admin:${POSTGRES_ADMIN_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_ADMIN_DATABASE_URL: postgres://admin:${POSTGRES_ADMIN_PASSWORD:-}@db:5432/${POSTGRES_DB:-brunn}
      BRUNN_S3_ACCESS_KEY: ${BRUNN_S3_ACCESS_KEY:-}
      BRUNN_S3_SECRET_KEY: ${BRUNN_S3_SECRET_KEY:-}
      BRUNN_MINIO_ACCESS_KEY: ${BRUNN_MINIO_ACCESS_KEY:-}
      BRUNN_MINIO_SECRET_KEY: ${BRUNN_MINIO_SECRET_KEY:-}
      BRUNN_CONTINUATION_SECRET: ${BRUNN_CONTINUATION_SIGNING_KEY:-}
      BRUNN_CONTINUATION_SIGNING_KEY: ${BRUNN_CONTINUATION_SIGNING_KEY:-}
      BRUNN_DEV_READ_WRITE_TOKEN: ${BRUNN_DEV_READ_WRITE_TOKEN:-}
      BRUNN_DEV_READ_ONLY_TOKEN: ${BRUNN_DEV_READ_ONLY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRUNN_APNS_APP_ID: ${BRUNN_APNS_APP_ID:-}
      BRUNN_APNS_DELIVERY_ENABLED: ${BRUNN_APNS_DELIVERY_ENABLED:-false}
      BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY:-}
      BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY_FILE: ${BRUNN_NOTIFICATION_TOKEN_ENCRYPTION_KEY_FILE:-}
      BRUNN_SECRET_ENCRYPTION_KEY: ${BRUNN_SECRET_ENCRYPTION_KEY:-}
      BRUNN_SECRET_ENCRYPTION_KEY_FILE: ${BRUNN_SECRET_ENCRYPTION_KEY_FILE:-}
      BRUNN_TODOIST_SYNC_ENABLED: ${BRUNN_TODOIST_SYNC_ENABLED:-false}
      BRUNN_APNS_TEAM_ID: ${BRUNN_APNS_TEAM_ID:-}
      BRUNN_APNS_KEY_ID: ${BRUNN_APNS_KEY_ID:-}
      BRUNN_APNS_PRIVATE_KEY: ${BRUNN_APNS_PRIVATE_KEY:-}
      BRUNN_APNS_PRIVATE_KEY_FILE: ${BRUNN_APNS_PRIVATE_KEY_FILE:-}
    labels:
      <<: *common-labels
      com.brunn.component: worker
      com.datadoghq.ad.logs: >-
        [{"source":"rust","service":"brunn"}]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 4g
    cpus: 4
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  datadog-agent:
    image: ${DATADOG_AGENT_IMAGE:-gcr.io/datadoghq/agent:7.81.2@sha256:44bfe2c475d9467e78e73e4327148d7e3902da5a48cbb1b0f6b84b01283e89d5}
    profiles: ["observability"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-development}
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_TAG_CARDINALITY: low
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
      DD_APM_ENABLED: "false"
      DD_CONTAINER_EXCLUDE: name:datadog-agent
      DD_CONTAINER_LABELS_AS_TAGS: >-
        {"com.brunn.component":"component"}
      DD_TAGS: project:brunn
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    healthcheck:
      test: ["CMD", "agent", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 512

  # The API listens on 8080 in its container. This tools-only bridge preserves
  # the MCP adapter's canonical http://api:18110 URL without changing web/API
  # networking or exposing another host port.
  api-tools-port:
    image: alpine/socat:1.8.1.3@sha256:4e625a62c9ea40ccbce93b9a4fcc6b41740a9f308389c216f34c88ce3abb275b
    profiles: ["tools"]
    network_mode: "service:api"
    command:
      - TCP-LISTEN:18110,fork,reuseaddr
      - TCP:127.0.0.1:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "18110"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: "no"

  mcp:
    build:
      context: apps/mcp
      dockerfile: Dockerfile
      args:
        BRUNN_BUILD_REVISION: ${DD_VERSION:-local}
    image: brunn-mcp:local
    profiles: ["tools"]
    environment:
      BRUNN_API_URL: http://api:18110
      BRUNN_API_TOKEN: ${BRUNN_MCP_API_TOKEN:-}
      BRUNN_MESSAGING_ENABLED: ${BRUNN_MESSAGING_ENABLED:-false}
      BRUNN_MCP_IMPORT_ROOT: /imports
      BRUNN_STATE_MCP_ASSET_ROOT: /assets
    volumes:
      - ${BRUNN_MCP_IMPORT_ROOT:-./imports}:/imports:ro
      - ${BRUNN_STATE_MCP_ASSET_HOST_ROOT:-./mcp-assets}:/assets
    depends_on:
      api-tools-port:
        condition: service_healthy
    stdin_open: true
    tty: false
    restart: "no"
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        BRUNN_BUILD_REVISION: ${DD_VERSION:-local}
    image: brunn-web:local
    ports:
      - "0.0.0.0:${BRUNN_WEB_PORT:-13110}:8080"
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  minio_data:
