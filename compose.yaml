name: straylight

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  args:
    STRAYLIGHT_BUILD_REVISION: ${DD_VERSION:-local}

x-common-labels: &common-labels
  com.datadoghq.tags.env: ${DD_ENV:-development}
  com.datadoghq.tags.service: ${DD_SERVICE:-straylight}
  com.datadoghq.tags.version: ${DD_VERSION:-local}

x-common-environment: &common-environment
  STRAYLIGHT_ENV: ${STRAYLIGHT_ENV:-development}
  STRAYLIGHT_LEGACY_API_ENABLED: ${STRAYLIGHT_LEGACY_API_ENABLED:-true}
  STRAYLIGHT_EVALUATION_API_ENABLED: ${STRAYLIGHT_EVALUATION_API_ENABLED:-true}
  RUST_LOG: ${RUST_LOG:-info,straylight=debug}
  STRAYLIGHT_BIND: 0.0.0.0:8080
  STRAYLIGHT_BIND_ADDR: 0.0.0.0:8080
  STRAYLIGHT_S3_ENDPOINT: ${STRAYLIGHT_S3_ENDPOINT:-http://minio:9000}
  STRAYLIGHT_S3_REGION: ${STRAYLIGHT_S3_REGION:-us-east-1}
  STRAYLIGHT_S3_BUCKET: ${STRAYLIGHT_S3_BUCKET:-straylight}
  STRAYLIGHT_MINIO_ENDPOINT: http://minio:9000
  STRAYLIGHT_MINIO_REGION: ${STRAYLIGHT_MINIO_REGION:-us-east-1}
  STRAYLIGHT_MINIO_BUCKET: ${STRAYLIGHT_MINIO_BUCKET:-straylight}
  STRAYLIGHT_EMBEDDING_PROVIDER: ${STRAYLIGHT_EMBEDDING_PROVIDER:-openai}
  STRAYLIGHT_ALLOW_DEGRADED_EMBEDDINGS: ${STRAYLIGHT_ALLOW_DEGRADED_EMBEDDINGS:-false}
  STRAYLIGHT_EMBEDDING_MODEL: ${STRAYLIGHT_EMBEDDING_MODEL:-text-embedding-3-small}
  STRAYLIGHT_EMBEDDING_DIMENSIONS: ${STRAYLIGHT_EMBEDDING_DIMENSIONS:-1536}
  STRAYLIGHT_DREAM_MODEL: ${STRAYLIGHT_DREAM_MODEL:-gpt-5.6}
  STRAYLIGHT_CAPTURE_MODEL: ${STRAYLIGHT_CAPTURE_MODEL:-gpt-5.6}
  STRAYLIGHT_CAPTURE_MAX_OUTPUT_TOKENS: ${STRAYLIGHT_CAPTURE_MAX_OUTPUT_TOKENS:-8192}
  CARRYSTATE_ASSET_DESCRIPTION_MODEL: ${CARRYSTATE_ASSET_DESCRIPTION_MODEL:-gpt-5.6}
  CARRYSTATE_ASSET_DESCRIPTION_MAX_OUTPUT_TOKENS: ${CARRYSTATE_ASSET_DESCRIPTION_MAX_OUTPUT_TOKENS:-4096}
  CARRYSTATE_ASSET_DESCRIPTION_IMAGE_DETAIL: ${CARRYSTATE_ASSET_DESCRIPTION_IMAGE_DETAIL:-high}
  STRAYLIGHT_DREAM_SCHEDULER_ENABLED: ${STRAYLIGHT_DREAM_SCHEDULER_ENABLED:-true}
  STRAYLIGHT_DREAM_SCHEDULER_POLL_SECONDS: ${STRAYLIGHT_DREAM_SCHEDULER_POLL_SECONDS:-15}
  STRAYLIGHT_DREAM_INACTIVITY_SECONDS: ${STRAYLIGHT_DREAM_INACTIVITY_SECONDS:-60}
  STRAYLIGHT_DREAM_COOLDOWN_SECONDS: ${STRAYLIGHT_DREAM_COOLDOWN_SECONDS:-900}
  STRAYLIGHT_DREAM_DIRTY_THRESHOLD: ${STRAYLIGHT_DREAM_DIRTY_THRESHOLD:-10}
  STRAYLIGHT_BACKGROUND_JOB_LEASE_SECONDS: ${STRAYLIGHT_BACKGROUND_JOB_LEASE_SECONDS:-300}
  STRAYLIGHT_ACCOUNT_EXPORT_TTL_HOURS: ${STRAYLIGHT_ACCOUNT_EXPORT_TTL_HOURS:-24}
  STRAYLIGHT_ACCOUNT_EXPORT_TEMP_DIR: /tmp/straylight-exports
  STRAYLIGHT_ACCOUNT_DELETION_BACKUP_RETENTION_DAYS: ${STRAYLIGHT_ACCOUNT_DELETION_BACKUP_RETENTION_DAYS:-30}
  STRAYLIGHT_DATABASE_MAX_CONNECTIONS: ${STRAYLIGHT_DATABASE_MAX_CONNECTIONS:-20}
  STRAYLIGHT_MATERIALIZE_TOKEN_BUDGET: ${STRAYLIGHT_MATERIALIZE_TOKEN_BUDGET:-24000}
  STRAYLIGHT_REQUEST_TIMEOUT_SECONDS: ${STRAYLIGHT_REQUEST_TIMEOUT_SECONDS:-30}
  STRAYLIGHT_TRANSFER_TIMEOUT_SECONDS: ${STRAYLIGHT_TRANSFER_TIMEOUT_SECONDS:-3600}
  STRAYLIGHT_MAX_CONCURRENT_TRANSFERS: ${STRAYLIGHT_MAX_CONCURRENT_TRANSFERS:-8}
  STRAYLIGHT_READINESS_TIMEOUT_SECONDS: ${STRAYLIGHT_READINESS_TIMEOUT_SECONDS:-3}
  STRAYLIGHT_ALLOWED_ORIGINS: ${STRAYLIGHT_ALLOWED_ORIGINS:-}
  STRAYLIGHT_DEV_USER_REF: ${STRAYLIGHT_DEV_USER_REF:-user:local}
  STRAYLIGHT_DEV_USER_NAME: ${STRAYLIGHT_DEV_USER_NAME:-Local user}
  OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  STRAYLIGHT_METRICS_ENABLED: ${STRAYLIGHT_METRICS_ENABLED:-false}
  STRAYLIGHT_DOGSTATSD_ADDR: ${STRAYLIGHT_DOGSTATSD_ADDR:-datadog-agent:8125}
  STRAYLIGHT_METRICS_FLUSH_SECONDS: ${STRAYLIGHT_METRICS_FLUSH_SECONDS:-3}
  DD_ENV: ${DD_ENV:-development}
  DD_SERVICE: ${DD_SERVICE:-straylight}
  DD_VERSION: ${DD_VERSION:-local}

services:
  db:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
      args:
        STRAYLIGHT_BUILD_REVISION: ${STRAYLIGHT_BUILD_REVISION:-local}
    image: ${STRAYLIGHT_DATABASE_IMAGE:-straylight-postgres:local}
    command:
      - postgres
      - -c
      - max_wal_size=${STRAYLIGHT_POSTGRES_MAX_WAL_SIZE:-4GB}
      - -c
      - min_wal_size=${STRAYLIGHT_POSTGRES_MIN_WAL_SIZE:-1GB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-straylight}
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      APP_RW_PASSWORD: ${POSTGRES_APP_RW_PASSWORD:-}
      APP_RO_PASSWORD: ${POSTGRES_APP_RO_PASSWORD:-}
      POSTGRES_INITDB_ARGS: >-
        --locale-provider=builtin --builtin-locale=C.UTF-8
        --encoding=UTF8 --data-checksums
    ports:
      - "127.0.0.1:${STRAYLIGHT_POSTGRES_PORT:-15110}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/straylight-postgres-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 6g
    cpus: 4
    pids_limit: 512
    shm_size: 256m

  minio-permissions:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    command:
      - /bin/sh
      - -ec
      - |
        marker=/data/.straylight-owner-10001
        if [ ! -e "$${marker}" ]; then
          chown -R 10001:10001 /data
          : > "$${marker}"
          chown 10001:10001 "$${marker}"
        fi
    volumes:
      - minio_data:/data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  minio:
    build:
      context: infra/minio
      args:
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        STRAYLIGHT_BUILD_REVISION: ${DD_VERSION:-local}
    image: straylight-minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:${STRAYLIGHT_MINIO_PORT:-19110}:9000"
      - "127.0.0.1:${STRAYLIGHT_MINIO_CONSOLE_PORT:-19111}:9001"
    volumes:
      - minio_data:/data
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 3g
    cpus: 3
    pids_limit: 512

  minio-init:
    build:
      context: infra/minio-client
      args:
        MC_COMMIT: 7394ce0dd2a80935aded936b09fa12cbb3cb8096
        MC_RELEASE: RELEASE.2025-08-13T08-35-41Z
        STRAYLIGHT_BUILD_REVISION: ${DD_VERSION:-local}
    image: straylight-minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      STRAYLIGHT_MINIO_BUCKET: ${STRAYLIGHT_MINIO_BUCKET:-straylight}
      STRAYLIGHT_MINIO_ACCESS_KEY: ${STRAYLIGHT_MINIO_ACCESS_KEY:-}
      STRAYLIGHT_MINIO_SECRET_KEY: ${STRAYLIGHT_MINIO_SECRET_KEY:-}
    volumes:
      - ./infra/minio/app-policy.json:/config/app-policy.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        load_secret() {
          variable=$$1
          file_variable="$${variable}_FILE"
          eval "value=\$${$${variable}:-}"
          eval "file=\$${$${file_variable}:-}"
          if [ -n "$${value}" ] && [ -n "$${file}" ]; then
            echo "$${variable} and $${file_variable} cannot both be set" >&2
            exit 1
          fi
          if [ -n "$${file}" ]; then
            value=$$(cat "$${file}")
            export "$${variable}=$${value}"
          fi
          [ -n "$${value}" ] || {
            echo "$${variable} is required" >&2
            exit 1
          }
        }
        for variable in MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
          STRAYLIGHT_MINIO_ACCESS_KEY STRAYLIGHT_MINIO_SECRET_KEY; do
          load_secret "$${variable}"
        done
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${STRAYLIGHT_MINIO_BUCKET}"
        mc version enable "local/$${STRAYLIGHT_MINIO_BUCKET}"
        mc anonymous set none "local/$${STRAYLIGHT_MINIO_BUCKET}"
        : > /tmp/straylight-app-policy.json
        while IFS= read -r policy_line || [ -n "$${policy_line}" ]; do
          printf '%s\n' \
            "$${policy_line//__STRAYLIGHT_BUCKET__/$${STRAYLIGHT_MINIO_BUCKET}}" \
            >> /tmp/straylight-app-policy.json
        done < /config/app-policy.json
        mc admin user add local "$${STRAYLIGHT_MINIO_ACCESS_KEY}" "$${STRAYLIGHT_MINIO_SECRET_KEY}" || \
          mc admin user info local "$${STRAYLIGHT_MINIO_ACCESS_KEY}"
        mc admin policy create local straylight-app /tmp/straylight-app-policy.json || \
          mc admin policy info local straylight-app
        mc admin policy attach local straylight-app --user "$${STRAYLIGHT_MINIO_ACCESS_KEY}"
    restart: "no"

  migrate:
    build: *api-build
    image: straylight-api:local
    command: ["migrate"]
    environment:
      <<: *common-environment
      DATABASE_URL_RW: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      DATABASE_URL_RO: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_DATABASE_URL: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_READ_ONLY_DATABASE_URL: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      DATABASE_URL_ADMIN: postgres://admin:${POSTGRES_ADMIN_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_ADMIN_DATABASE_URL: postgres://admin:${POSTGRES_ADMIN_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_S3_ACCESS_KEY: ${STRAYLIGHT_S3_ACCESS_KEY:-}
      STRAYLIGHT_S3_SECRET_KEY: ${STRAYLIGHT_S3_SECRET_KEY:-}
      STRAYLIGHT_MINIO_ACCESS_KEY: ${STRAYLIGHT_MINIO_ACCESS_KEY:-}
      STRAYLIGHT_MINIO_SECRET_KEY: ${STRAYLIGHT_MINIO_SECRET_KEY:-}
      STRAYLIGHT_CONTINUATION_SECRET: ${STRAYLIGHT_CONTINUATION_SIGNING_KEY:-}
      STRAYLIGHT_CONTINUATION_SIGNING_KEY: ${STRAYLIGHT_CONTINUATION_SIGNING_KEY:-}
      STRAYLIGHT_DEV_READ_WRITE_TOKEN: ${STRAYLIGHT_DEV_READ_WRITE_TOKEN:-}
      STRAYLIGHT_DEV_READ_ONLY_TOKEN: ${STRAYLIGHT_DEV_READ_ONLY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: straylight-api:local
    command: ["serve"]
    environment:
      <<: *common-environment
      DATABASE_URL_RW: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      DATABASE_URL_RO: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_DATABASE_URL: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_READ_ONLY_DATABASE_URL: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_S3_ACCESS_KEY: ${STRAYLIGHT_S3_ACCESS_KEY:-}
      STRAYLIGHT_S3_SECRET_KEY: ${STRAYLIGHT_S3_SECRET_KEY:-}
      STRAYLIGHT_MINIO_ACCESS_KEY: ${STRAYLIGHT_MINIO_ACCESS_KEY:-}
      STRAYLIGHT_MINIO_SECRET_KEY: ${STRAYLIGHT_MINIO_SECRET_KEY:-}
      STRAYLIGHT_CONTINUATION_SECRET: ${STRAYLIGHT_CONTINUATION_SIGNING_KEY:-}
      STRAYLIGHT_CONTINUATION_SIGNING_KEY: ${STRAYLIGHT_CONTINUATION_SIGNING_KEY:-}
      STRAYLIGHT_DEV_READ_WRITE_TOKEN: ${STRAYLIGHT_DEV_READ_WRITE_TOKEN:-}
      STRAYLIGHT_DEV_READ_ONLY_TOKEN: ${STRAYLIGHT_DEV_READ_ONLY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    labels:
      <<: *common-labels
      com.straylight.component: api
      com.datadoghq.ad.logs: >-
        [{"source":"rust","service":"straylight"}]
    ports:
      - "127.0.0.1:${STRAYLIGHT_API_PORT:-18110}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/straylight", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build: *api-build
    image: straylight-api:local
    command: ["worker"]
    environment:
      <<: *common-environment
      DATABASE_URL_RW: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      DATABASE_URL_RO: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_DATABASE_URL: postgres://app_rw:${POSTGRES_APP_RW_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_READ_ONLY_DATABASE_URL: postgres://app_ro:${POSTGRES_APP_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      DATABASE_URL_ADMIN: postgres://admin:${POSTGRES_ADMIN_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_ADMIN_DATABASE_URL: postgres://admin:${POSTGRES_ADMIN_PASSWORD:-}@db:5432/${POSTGRES_DB:-straylight}
      STRAYLIGHT_S3_ACCESS_KEY: ${STRAYLIGHT_S3_ACCESS_KEY:-}
      STRAYLIGHT_S3_SECRET_KEY: ${STRAYLIGHT_S3_SECRET_KEY:-}
      STRAYLIGHT_MINIO_ACCESS_KEY: ${STRAYLIGHT_MINIO_ACCESS_KEY:-}
      STRAYLIGHT_MINIO_SECRET_KEY: ${STRAYLIGHT_MINIO_SECRET_KEY:-}
      STRAYLIGHT_CONTINUATION_SECRET: ${STRAYLIGHT_CONTINUATION_SIGNING_KEY:-}
      STRAYLIGHT_CONTINUATION_SIGNING_KEY: ${STRAYLIGHT_CONTINUATION_SIGNING_KEY:-}
      STRAYLIGHT_DEV_READ_WRITE_TOKEN: ${STRAYLIGHT_DEV_READ_WRITE_TOKEN:-}
      STRAYLIGHT_DEV_READ_ONLY_TOKEN: ${STRAYLIGHT_DEV_READ_ONLY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    labels:
      <<: *common-labels
      com.straylight.component: worker
      com.datadoghq.ad.logs: >-
        [{"source":"rust","service":"straylight"}]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 4g
    cpus: 4
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  datadog-agent:
    image: ${DATADOG_AGENT_IMAGE:-gcr.io/datadoghq/agent:7.81.2@sha256:44bfe2c475d9467e78e73e4327148d7e3902da5a48cbb1b0f6b84b01283e89d5}
    profiles: ["observability"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-development}
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_TAG_CARDINALITY: low
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
      DD_APM_ENABLED: "false"
      DD_CONTAINER_EXCLUDE: name:datadog-agent
      DD_CONTAINER_LABELS_AS_TAGS: >-
        {"com.straylight.component":"component"}
      DD_TAGS: project:straylight
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    healthcheck:
      test: ["CMD", "agent", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 512

  # The API listens on 8080 in its container. This tools-only bridge preserves
  # the MCP adapter's canonical http://api:18110 URL without changing web/API
  # networking or exposing another host port.
  api-tools-port:
    image: alpine/socat:1.8.1.3@sha256:4e625a62c9ea40ccbce93b9a4fcc6b41740a9f308389c216f34c88ce3abb275b
    profiles: ["tools"]
    network_mode: "service:api"
    command:
      - TCP-LISTEN:18110,fork,reuseaddr
      - TCP:127.0.0.1:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "18110"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: "no"

  mcp:
    build:
      context: apps/mcp
      dockerfile: Dockerfile
      args:
        STRAYLIGHT_BUILD_REVISION: ${DD_VERSION:-local}
    image: straylight-mcp:local
    profiles: ["tools"]
    environment:
      STRAYLIGHT_API_URL: http://api:18110
      STRAYLIGHT_API_TOKEN: ${STRAYLIGHT_MCP_API_TOKEN:-}
      STRAYLIGHT_MCP_IMPORT_ROOT: /imports
      CARRYSTATE_MCP_ASSET_ROOT: /assets
    volumes:
      - ${STRAYLIGHT_MCP_IMPORT_ROOT:-./imports}:/imports:ro
      - ${CARRYSTATE_MCP_ASSET_HOST_ROOT:-./mcp-assets}:/assets
    depends_on:
      api-tools-port:
        condition: service_healthy
    stdin_open: true
    tty: false
    restart: "no"
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        STRAYLIGHT_BUILD_REVISION: ${DD_VERSION:-local}
    image: straylight-web:local
    ports:
      - "0.0.0.0:${STRAYLIGHT_WEB_PORT:-13110}:8080"
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  minio_data:
