name: RuptureOps

options:
  minimumXcodeGenVersion: 2.45.4
  bundleIdPrefix: com.rourkem
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1"

targets:
  RuptureOps:
    type: application
    platform: iOS
    sources:
      - path: RuptureOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.ruptureops
        PRODUCT_NAME: RuptureOps
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RuptureOps
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RuptureOpsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RuptureOpsTests
    dependencies:
      - target: RuptureOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.ruptureops.tests
        GENERATE_INFOPLIST_FILE: YES

  RuptureOpsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RuptureOpsUITests
    dependencies:
      - target: RuptureOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rourkem.ruptureops.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RuptureOps:
    build:
      targets:
        RuptureOps: all
        RuptureOpsTests: [test]
        RuptureOpsUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: RuptureOpsTests
        - name: RuptureOpsUITests

