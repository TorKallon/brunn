<svg xmlns="http://www.w3.org/2000/svg" width="1308" height="1454" viewBox="0 0 1308 1454" role="img" aria-labelledby="title desc">
  <title id="title">StarRupture named world locations</title>
  <desc id="desc">Rourke's world-map screenshot annotated with Landerworks, Flowworks, Faraday Works, Grand Basin Reserve, Mythic Cry, the Forgotten Engine, and parent-relative utility satellites.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <style>
      .label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .name { font-size: 22px; font-weight: 750; }
      .detail { font-size: 15px; font-weight: 520; fill: #e7edf3; }
      .small { font-size: 13px; font-weight: 520; fill: #dce5eb; }
      .box { fill: #10171d; fill-opacity: 0.88; stroke: #f5f8fa; stroke-opacity: 0.72; stroke-width: 1.5; rx: 9; }
      .active { fill: #4db4d7; stroke: #fff; stroke-width: 4; }
      .planned { fill: #b98cff; stroke: #fff; stroke-width: 4; }
      .reserve { fill: #55c58b; stroke: #fff; stroke-width: 4; }
      .landmark { fill: #ffc857; stroke: #fff; stroke-width: 4; }
      .satellite { fill: none; stroke: #ffc857; stroke-width: 3; stroke-dasharray: 7 6; }
      .leader { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
      .relation { fill: none; stroke: #f3f7f9; stroke-width: 4; stroke-opacity: 0.85; stroke-dasharray: 11 8; filter: url(#shadow); }
    </style>
  </defs>

  <image href="world-map-overview.png" x="0" y="0" width="1308" height="1454" preserveAspectRatio="none"/>
  <rect x="0" y="0" width="1308" height="1454" fill="#061018" fill-opacity="0.08"/>

  <g class="label" filter="url(#shadow)">
    <rect class="box" x="34" y="28" width="430" height="80"/>
    <text class="name" x="56" y="61">Named world map</text>
    <text class="detail" x="56" y="88">Update 1 playthrough · north is up</text>
    <path d="M1228 102 L1228 37 M1228 37 L1217 56 M1228 37 L1239 56" stroke="#fff" stroke-width="4" fill="none"/>
    <text class="name" x="1218" y="128">N</text>
  </g>

  <!-- Schematic site axis; this shows relationships, not surveyed track geometry. -->
  <path class="relation" d="M218 1051 Q328 995 443 953 Q520 972 588 998"/>

  <!-- Grand Basin -->
  <ellipse cx="374" cy="510" rx="118" ry="92" fill="#55c58b" fill-opacity="0.14" stroke="#55c58b" stroke-width="4" stroke-dasharray="12 8"/>
  <circle class="reserve" cx="374" cy="510" r="14"/>
  <path class="leader" d="M388 500 L485 433"/>
  <rect class="box" x="480" y="371" width="330" height="105"/>
  <text class="label name" x="500" y="407">Grand Basin Reserve</text>
  <text class="label detail" x="500" y="434">Large multi-campus basin</text>
  <text class="label small" x="500" y="457">Reserve pin marks the area, not a Core</text>

  <!-- Mythic Cry -->
  <circle class="landmark" cx="286" cy="574" r="12"/>
  <path class="leader" d="M276 580 L155 622"/>
  <rect class="box" x="34" y="605" width="286" height="92"/>
  <text class="label name" x="54" y="640">GRO “Mythic Cry”</text>
  <text class="label detail" x="54" y="667">Blueprint POI in the mountains</text>
  <text class="label small" x="54" y="688">Immediately west of Grand Basin</text>

  <!-- Landerworks -->
  <circle class="active" cx="218" cy="1051" r="14"/>
  <path class="leader" d="M206 1043 L120 982"/>
  <rect class="box" x="30" y="900" width="305" height="108"/>
  <text class="label name" x="50" y="936">Landerworks · LW</text>
  <text class="label detail" x="50" y="963">Base 1 · initial lander</text>
  <text class="label small" x="50" y="986">Sunstone Station nearby; exact pin open</text>

  <!-- Flowworks -->
  <circle class="planned" cx="443" cy="953" r="14"/>
  <path class="leader" d="M443 939 L443 856"/>
  <rect class="box" x="322" y="782" width="300" height="92"/>
  <text class="label name" x="342" y="818">Flowworks · FLW</text>
  <text class="label detail" x="342" y="845">Planned Ti/W mechanical Works</text>
  <text class="label small" x="342" y="866">Between Landerworks and Faraday</text>

  <!-- Faraday -->
  <circle class="active" cx="588" cy="998" r="14"/>
  <path class="leader" d="M602 996 L708 952"/>
  <rect class="box" x="700" y="884" width="336" height="110"/>
  <text class="label name" x="720" y="920">Faraday Works · FW</text>
  <text class="label detail" x="720" y="947">Base 2 · electrochem campus</text>
  <text class="label small" x="720" y="970">Brimstone Utility linked; exact pin open</text>

  <!-- Forgotten Engine -->
  <circle class="landmark" cx="807" cy="718" r="12"/>
  <path class="leader" d="M819 711 L927 655"/>
  <rect class="box" x="918" y="598" width="280" height="82"/>
  <text class="label name" x="938" y="634">Forgotten Engine</text>
  <text class="label detail" x="938" y="661">Major east-central landmark</text>

  <!-- Legend -->
  <rect class="box" x="835" y="1258" width="420" height="156"/>
  <text class="label detail" x="858" y="1290">Legend</text>
  <circle class="active" cx="868" cy="1320" r="8"/><text class="label small" x="887" y="1325">Active Works</text>
  <circle class="planned" cx="1030" cy="1320" r="8"/><text class="label small" x="1049" y="1325">Planned Works</text>
  <circle class="reserve" cx="868" cy="1356" r="8"/><text class="label small" x="887" y="1361">Reserve area</text>
  <circle class="landmark" cx="1030" cy="1356" r="8"/><text class="label small" x="1049" y="1361">Exploration landmark</text>
  <path d="M858 1388 L900 1388" class="relation"/><text class="label small" x="913" y="1393">Site axis, not surveyed rail path</text>
</svg>
